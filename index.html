<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>TEST AUDIO</title>
<style>
  body{background:#111;color:#eee;font-family:monospace;padding:30px;font-size:16px;}
  h1{color:#c1121f;}
  .fila{margin:14px 0;padding:12px;border:1px solid #333;background:#1a1a1a;}
  .ok{color:#4ade80;font-weight:bold;}
  .fail{color:#ff2b2b;font-weight:bold;}
  button{font-size:16px;padding:10px 20px;cursor:pointer;margin-right:8px;}
  pre{background:#000;padding:10px;overflow-x:auto;color:#0f0;}
</style>
</head>
<body>

<h1>DIAGNÓSTICO DE ASSETS</h1>
<p>Esta página comprueba si los archivos están donde deben y si se pueden cargar.</p>

<div id="resultados"></div>

<h2>Prueba manual de reproducción</h2>
<button onclick="probarAudio('Assets/pegi18.mp3')">▶ pegi18.mp3</button>
<button onclick="probarAudio('Assets/juego-comenzado.mp3')">▶ juego-comenzado.mp3</button>
<button onclick="probarAudio('Assets/menu-theme.mp3')">▶ menu-theme.mp3</button>

<pre id="log"></pre>

<script>
const ARCHIVOS = [
  { ruta:"Assets/pegi18.mp3",             tipo:"audio" },
  { ruta:"Assets/juego-comenzado.mp3",    tipo:"audio" },
  { ruta:"Assets/menu-theme.mp3",         tipo:"audio" },
  { ruta:"Assets/menu-bg.jpg",            tipo:"imagen" }
];

const cont = document.getElementById('resultados');
const log  = document.getElementById('log');

function escribir(msg){
  log.textContent += msg + "\n";
  console.log(msg);
}

ARCHIVOS.forEach(arch => {
  const div = document.createElement('div');
  div.className = 'fila';
  div.innerHTML = '<strong>' + arch.ruta + '</strong> → <span id="r-' + arch.ruta + '">comprobando…</span>';
  cont.appendChild(div);

  if (arch.tipo === 'audio'){
    const a = new Audio();
    a.addEventListener('canplaythrough', () => {
      document.getElementById('r-' + arch.ruta).innerHTML = '<span class="ok">✓ CARGA OK</span>';
      escribir('[OK] ' + arch.ruta);
    });
    a.addEventListener('error', () => {
      document.getElementById('r-' + arch.ruta).innerHTML = '<span class="fail">✗ ERROR (404 o formato no soportado)</span>';
      escribir('[FAIL] ' + arch.ruta + ' → error de carga');
    });
    a.src = arch.ruta;
    a.load();
  } else {
    const img = new Image();
    img.onload = () => {
      document.getElementById('r-' + arch.ruta).innerHTML = '<span class="ok">✓ CARGA OK</span>';
      escribir('[OK] ' + arch.ruta);
    };
    img.onerror = () => {
      document.getElementById('r-' + arch.ruta).innerHTML = '<span class="fail">✗ ERROR (404)</span>';
      escribir('[FAIL] ' + arch.ruta);
    };
    img.src = arch.ruta;
  }
});

function probarAudio(ruta){
  escribir('--- Probando: ' + ruta);
  const a = new Audio(ruta);
  a.volume = 1;
  const p = a.play();
  if (p && p.catch){
    p.then(() => escribir('  ▶ Reproduciendo…'))
     .catch(err => escribir('  ✗ No se pudo reproducir: ' + err.message));
  }
}
</script>

</body>
</html>
