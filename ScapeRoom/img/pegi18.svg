<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="Clasificación por edad: PEGI 18">
  <!-- Placa de clasificación por edad PEGI 18 -->
  <rect x="0" y="0" width="320" height="320" rx="10" fill="#000000"/>
  <rect x="9" y="9" width="302" height="302" rx="6" fill="none" stroke="#ffffff" stroke-width="4"/>

  <!-- Wordmark PEGI -->
  <text x="160" y="86" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-weight="700"
        font-size="56" letter-spacing="10" fill="#ffffff">PEGI</text>

  <!-- Número de edad -->
  <text x="160" y="248" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-weight="800"
        font-size="196" letter-spacing="-6" fill="#ffffff">18</text>

  <!-- Marca de registro -->
  <text x="292" y="300" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-weight="700"
        font-size="26" fill="#ffffff">®</text>
</svg>
